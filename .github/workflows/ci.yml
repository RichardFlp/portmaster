name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["stable", "1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt required on:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.go }}
          path: test.log
          if-no-files-found: ignore
      - name: Build
        run: go build ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Race tests
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -race ./... 2>&1 | tee race.log
      - name: Upload race log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: race-log
          path: race.log
          if-no-files-found: ignore
